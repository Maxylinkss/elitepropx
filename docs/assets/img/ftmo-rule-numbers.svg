<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-label="A one hundred thousand dollar FTMO account shown on a scale from a static ninety thousand dollar floor through the starting balance to a one hundred and ten thousand dollar phase one target, with chips for the five percent daily loss, the five thousand dollar phase two target and the four minimum trading days" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="940" height="480" fill="#fff"/>
  <text x="48" y="46" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">FTMO RULEBOOK</text>
  <text x="48" y="82" font-size="26" font-weight="800" fill="#0b1220">The five numbers on a $100,000 account</text>

  <rect x="150" y="196" width="640" height="8" rx="4" fill="#f4f7fc"/>
  <rect x="150" y="196" width="320" height="8" rx="4" fill="#fbe9e8"/>
  <rect x="470" y="196" width="320" height="8" rx="4" fill="#e7f7f0"/>

  <circle cx="150" cy="200" r="10" fill="#d9534f"/>
  <circle cx="470" cy="200" r="10" fill="#0b1220"/>
  <circle cx="790" cy="200" r="10" fill="#0e9f6e"/>

  <text x="150" y="152" font-size="19" font-weight="800" fill="#d9534f" text-anchor="middle">$90,000</text>
  <text x="470" y="152" font-size="19" font-weight="800" fill="#0b1220" text-anchor="middle">$100,000</text>
  <text x="790" y="152" font-size="19" font-weight="800" fill="#0e9f6e" text-anchor="middle">$110,000</text>

  <text x="150" y="232" font-size="12.5" fill="#6b7a92" text-anchor="middle">10% maximum loss</text>
  <text x="150" y="250" font-size="12.5" fill="#6b7a92" text-anchor="middle">static floor</text>
  <text x="470" y="232" font-size="12.5" fill="#6b7a92" text-anchor="middle">starting balance</text>
  <text x="790" y="232" font-size="12.5" fill="#6b7a92" text-anchor="middle">phase one target</text>

  <g>
    <rect x="48" y="292" width="272" height="96" rx="10" fill="#f4f7fc"/>
    <text x="68" y="330" font-size="24" font-weight="800" fill="#0b1220">$5,000</text>
    <text x="68" y="354" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7a92">5% DAILY LOSS</text>
    <text x="68" y="374" font-size="12" fill="#3d4a61">Equity-based, resets daily</text>
  </g>
  <g>
    <rect x="334" y="292" width="272" height="96" rx="10" fill="#f4f7fc"/>
    <text x="354" y="330" font-size="24" font-weight="800" fill="#0b1220">$5,000</text>
    <text x="354" y="354" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7a92">PHASE TWO TARGET</text>
    <text x="354" y="374" font-size="12" fill="#3d4a61">Same floor, half the reward</text>
  </g>
  <g>
    <rect x="620" y="292" width="272" height="96" rx="10" fill="#f4f7fc"/>
    <text x="640" y="330" font-size="24" font-weight="800" fill="#0b1220">4 days</text>
    <text x="640" y="354" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7a92">MINIMUM TRADING DAYS</text>
    <text x="640" y="374" font-size="12" fill="#3d4a61">No time limit on the standard plan</text>
  </g>

  <text x="48" y="432" font-size="13" fill="#3d4a61">Target and floor are both 10% in phase one, a 1:1 ratio. Phase two asks 5% against the same 10% floor. Check the plan you buy for current figures.</text>
</svg>

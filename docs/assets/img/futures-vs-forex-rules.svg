<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Side by side comparison of percentage-based forex evaluation rules and dollar and contract based futures evaluation rules" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <defs><pattern id="fvf" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eef7" stroke-width="1"/></pattern></defs>
  <rect width="1000" height="560" fill="#fff"/>
  <rect width="1000" height="560" fill="url(#fvf)"/>
  <text x="50" y="52" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">TWO RULEBOOK MODELS</text>
  <text x="50" y="90" font-size="27" font-weight="800" fill="#0b1220">Percentage rules against contract rules</text>
  <rect x="50" y="118" width="420" height="374" rx="14" fill="#fff" stroke="#dbe3ef"/>
  <rect x="530" y="118" width="420" height="374" rx="14" fill="#e7f7f0" stroke="#bfe9d7"/>
  <text x="74" y="158" font-size="17" font-weight="800" fill="#0b1220">Forex / CFD</text>
  <text x="554" y="158" font-size="17" font-weight="800" fill="#0b1220">Futures</text>
  <g>
    <text x="74" y="206" font-size="12" font-weight="800" fill="#6b7a92">UNIT OF SIZE</text>
    <text x="74" y="228" font-size="13.5" fill="#3d4a61">Lots — divisible</text>
    <text x="554" y="206" font-size="12" font-weight="800" fill="#6b7a92">UNIT OF SIZE</text>
    <text x="554" y="228" font-size="13.5" fill="#3d4a61">Contracts — whole numbers</text>
  </g>
  <g>
    <text x="74" y="252" font-size="12" font-weight="800" fill="#6b7a92">TARGET</text>
    <text x="74" y="274" font-size="13.5" fill="#3d4a61">Percentage of balance</text>
    <text x="554" y="252" font-size="12" font-weight="800" fill="#6b7a92">TARGET</text>
    <text x="554" y="274" font-size="13.5" fill="#3d4a61">Dollar figure per plan</text>
  </g>
  <g>
    <text x="74" y="298" font-size="12" font-weight="800" fill="#6b7a92">DRAWDOWN</text>
    <text x="74" y="320" font-size="13.5" fill="#3d4a61">Percentage, static or trailing</text>
    <text x="554" y="298" font-size="12" font-weight="800" fill="#6b7a92">DRAWDOWN</text>
    <text x="554" y="320" font-size="13.5" fill="#3d4a61">Dollar figure, often trailing</text>
  </g>
  <g>
    <text x="74" y="344" font-size="12" font-weight="800" fill="#6b7a92">DAILY LIMIT</text>
    <text x="74" y="366" font-size="13.5" fill="#3d4a61">Percentage of balance</text>
    <text x="554" y="344" font-size="12" font-weight="800" fill="#6b7a92">DAILY LIMIT</text>
    <text x="554" y="366" font-size="13.5" fill="#3d4a61">Dollar figure, resets per session</text>
  </g>
  <g>
    <text x="74" y="390" font-size="12" font-weight="800" fill="#6b7a92">EXTRAS</text>
    <text x="74" y="412" font-size="13.5" fill="#3d4a61">Spreads and swaps</text>
    <text x="554" y="390" font-size="12" font-weight="800" fill="#6b7a92">EXTRAS</text>
    <text x="554" y="412" font-size="13.5" fill="#3d4a61">Data and platform fees</text>
  </g>
  <g>
    <text x="74" y="436" font-size="12" font-weight="800" fill="#6b7a92">ROUNDING</text>
    <text x="74" y="458" font-size="13.5" fill="#3d4a61">Size can be halved</text>
    <text x="554" y="436" font-size="12" font-weight="800" fill="#6b7a92">ROUNDING</text>
    <text x="554" y="458" font-size="13.5" fill="#3d4a61">Size cannot be halved</text>
  </g>
  <text x="50" y="528" font-size="13.5" fill="#3d4a61">The last row is the one that changes the job: a futures plan cannot shave risk by fractions, only by whole contracts.</text>
</svg>

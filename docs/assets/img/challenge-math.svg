<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-label="Profit target and maximum loss shown as a range around the starting balance" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="940" height="500" fill="#fff"/>
  <text x="48" y="50" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">THE MATH</text>
  <text x="48" y="86" font-size="27" font-weight="800" fill="#0b1220">Target and drawdown are one equation</text>
  <rect x="48" y="140" width="844" height="150" rx="14" fill="#f4f7fc" stroke="#dbe3ef"/>
  <line x1="70" y1="215" x2="870" y2="215" stroke="#ccd7e7" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="70" y="196" width="800" height="38" fill="#e7f7f0"/>
  <text x="470" y="172" font-size="13" font-weight="700" fill="#6b7a92" text-anchor="middle">$100,000 starting balance</text>
  <text x="470" y="222" font-size="13" font-weight="800" fill="#0e9f6e" text-anchor="middle">+$10,000 target (10%)</text>
  <text x="470" y="262" font-size="13" font-weight="800" fill="#d9534f" text-anchor="middle">−$10,000 max loss (10%)</text>
  <text x="48" y="340" font-size="14" fill="#3d4a61">A 10% target with a 10% maximum loss means your account must survive a 1:1 risk-to-reward journey. Sizing for the loss limit, not the target, is what keeps the account alive.</text>
  <g>
    <rect x="48" y="380" width="268" height="80" rx="12" fill="#fff" stroke="#dbe3ef"/>
    <text x="70" y="416" font-size="22" font-weight="800" fill="#0b1220">1%</text>
    <text x="70" y="440" font-size="12" fill="#6b7a92">per trade · 20 losses to fail</text>
  </g>
  <g>
    <rect x="336" y="380" width="268" height="80" rx="12" fill="#fff" stroke="#dbe3ef"/>
    <text x="358" y="416" font-size="22" font-weight="800" fill="#0b1220">2%</text>
    <text x="358" y="440" font-size="12" fill="#6b7a92">per trade · 10 losses to fail</text>
  </g>
  <g>
    <rect x="624" y="380" width="268" height="80" rx="12" fill="#fff" stroke="#dbe3ef"/>
    <text x="646" y="416" font-size="22" font-weight="800" fill="#d9534f">5%</text>
    <text x="646" y="440" font-size="12" fill="#6b7a92">per trade · 4 losses to fail</text>
  </g>
</svg>

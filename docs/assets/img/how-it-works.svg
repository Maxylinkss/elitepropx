<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Four steps: choose your firm, pay the flat fee, we trade the evaluation, you receive the funded account" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <defs><pattern id="hiw" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eef7" stroke-width="1"/></pattern></defs>
  <rect width="1000" height="470" fill="#f4f7fc"/>
  <rect width="1000" height="470" fill="url(#hiw)"/>
  <text x="60" y="62" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">HOW ELITEPROPX WORKS</text>
  <text x="60" y="100" font-size="30" font-weight="800" fill="#0b1220">Four steps from evaluation to funded account</text>
  <g>
    <rect x="60" y="150" width="196" height="230" rx="16" fill="#fff" stroke="#dbe3ef"/>
    <rect x="60" y="150" width="196" height="6" rx="3" fill="#0e9f6e"/>
    <text x="84" y="205" font-size="34" font-weight="800" fill="#e7f7f0">01</text>
    <text x="84" y="240" font-size="18" font-weight="800" fill="#0b1220">Pick the firm</text>
    <text x="84" y="268" font-size="13" fill="#6b7a92">FTMO, FundedNext, Apex,</text>
    <text x="84" y="289" font-size="13" fill="#6b7a92">Topstep and 20+ more</text>
  </g>
  <g>
    <rect x="292" y="150" width="196" height="230" rx="16" fill="#fff" stroke="#dbe3ef"/>
    <rect x="292" y="150" width="196" height="6" rx="3" fill="#0e9f6e"/>
    <text x="316" y="205" font-size="34" font-weight="800" fill="#e7f7f0">02</text>
    <text x="316" y="240" font-size="18" font-weight="800" fill="#0b1220">Pay $220 flat</text>
    <text x="316" y="268" font-size="13" fill="#6b7a92">Any account size.</text>
    <text x="316" y="289" font-size="13" fill="#6b7a92">Retries included</text>
  </g>
  <g>
    <rect x="524" y="150" width="196" height="230" rx="16" fill="#fff" stroke="#dbe3ef"/>
    <rect x="524" y="150" width="196" height="6" rx="3" fill="#0e9f6e"/>
    <text x="548" y="205" font-size="34" font-weight="800" fill="#e7f7f0">03</text>
    <text x="548" y="240" font-size="18" font-weight="800" fill="#0b1220">We trade it</text>
    <text x="548" y="268" font-size="13" fill="#6b7a92">Rules-first execution on</text>
    <text x="548" y="289" font-size="13" fill="#6b7a92">your evaluation</text>
  </g>
  <g>
    <rect x="756" y="150" width="196" height="230" rx="16" fill="#fff" stroke="#dbe3ef"/>
    <rect x="756" y="150" width="196" height="6" rx="3" fill="#0e9f6e"/>
    <text x="780" y="205" font-size="34" font-weight="800" fill="#e7f7f0">04</text>
    <text x="780" y="240" font-size="18" font-weight="800" fill="#0b1220">Get funded</text>
    <text x="780" y="268" font-size="13" fill="#6b7a92">Login handed over,</text>
    <text x="780" y="289" font-size="13" fill="#6b7a92">100% of payouts yours</text>
  </g>
  <path d="M256 265 h26 m-8 -6 l8 6 -8 6" stroke="#243b5c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M488 265 h26 m-8 -6 l8 6 -8 6" stroke="#243b5c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M720 265 h26 m-8 -6 l8 6 -8 6" stroke="#243b5c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="430" font-size="13" fill="#6b7a92">Average completion time across managed evaluations: 14 days.</text>

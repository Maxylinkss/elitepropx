<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-label="Decision flow matching trading style and session availability to a percentage CFD evaluation or a dollar futures evaluation" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="980" height="470" fill="#fff"/>
  <text x="48" y="50" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">CHOOSING A MODEL</text>
  <text x="48" y="86" font-size="27" font-weight="800" fill="#0b1220">Start from your session, not the headline target</text>
  <rect x="48" y="120" width="240" height="86" rx="14" fill="#f4f7fc" stroke="#dbe3ef"/>
  <text x="72" y="156" font-size="15" font-weight="800" fill="#0b1220">Can you watch a</text>
  <text x="72" y="178" font-size="15" font-weight="800" fill="#0b1220">US session daily?</text>
  <text x="72" y="196" font-size="12" fill="#6b7a92">RTH, 9:30–16:00 ET</text>
  <g>
    <rect x="560" y="150" width="372" height="112" rx="14" fill="#fff" stroke="#dbe3ef"/>
    <text x="580" y="180" font-size="12" font-weight="800" letter-spacing="2" fill="#0e9f6e">YES</text>
    <text x="580" y="208" font-size="17" font-weight="800" fill="#0b1220">Futures evaluation</text>
    <text x="580" y="232" font-size="12.5" fill="#6b7a92">Dollar rules, session-based</text>
    <text x="580" y="249" font-size="12.5" fill="#6b7a92">market, no weekend gap</text>
  </g>
  <g>
    <rect x="560" y="300" width="372" height="112" rx="14" fill="#fff" stroke="#dbe3ef"/>
    <text x="580" y="330" font-size="12" font-weight="800" letter-spacing="2" fill="#0e9f6e">NO</text>
    <text x="580" y="358" font-size="17" font-weight="800" fill="#0b1220">Forex evaluation</text>
    <text x="580" y="382" font-size="12.5" fill="#6b7a92">Percentage rules, 24-hour</text>
    <text x="580" y="399" font-size="12.5" fill="#6b7a92">market, overnight holds</text>
  </g>
  <path d="M288 163 C380 163 420 206 556 206" fill="none" stroke="#243b5c" stroke-width="2" stroke-linecap="round"/>
  <path d="M548 200 l10 6 -10 6" fill="none" stroke="#243b5c" stroke-width="2" stroke-linecap="round"/>
  <path d="M288 163 C380 163 420 356 556 356" fill="none" stroke="#243b5c" stroke-width="2" stroke-linecap="round"/>
  <path d="M548 350 l10 6 -10 6" fill="none" stroke="#243b5c" stroke-width="2" stroke-linecap="round"/>
  <text x="48" y="440" font-size="13" fill="#6b7a92">Session availability is the constraint that decides which rulebook you can actually trade, so it belongs first in any comparison.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Three accounts with the same one percent risk and different leverage, showing margin required and distance to stop" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <defs><pattern id="lev" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eef7" stroke-width="1"/></pattern></defs>
  <rect width="1000" height="520" fill="#f4f7fc"/>
  <rect width="1000" height="520" fill="url(#lev)"/>
  <text x="50" y="56" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">LEVERAGE VERSUS RISK</text>
  <text x="50" y="94" font-size="29" font-weight="800" fill="#0b1220">Same 1% risk, three different margin requirements</text>
  <g>
    <rect x="50" y="140" width="284" height="300" rx="16" fill="#fff" stroke="#dbe3ef"/>
    <text x="74" y="196" font-size="36" font-weight="800" fill="#0e9f6e">1:30</text>
    <text x="74" y="222" font-size="15" font-weight="700" fill="#6b7a92">Forex retail</text>
    <line x1="74" y1="244" x2="310" y2="244" stroke="#dbe3ef"/>
    <text x="74" y="282" font-size="13" font-weight="700" letter-spacing="1" fill="#243b5c">MARGIN REQUIRED</text>
    <text x="74" y="316" font-size="26" font-weight="800" fill="#0b1220">$3,300</text>
    <text x="74" y="366" font-size="13" font-weight="700" letter-spacing="1" fill="#243b5c">RISK IF STOP HITS</text>
    <text x="74" y="400" font-size="26" font-weight="800" fill="#0b1220">$1,000</text>
  </g>
  <g>
    <rect x="358" y="140" width="284" height="300" rx="16" fill="#fff" stroke="#dbe3ef"/>
    <text x="382" y="196" font-size="36" font-weight="800" fill="#0e9f6e">1:100</text>
    <text x="382" y="222" font-size="15" font-weight="700" fill="#6b7a92">Forex pro</text>
    <line x1="382" y1="244" x2="618" y2="244" stroke="#dbe3ef"/>
    <text x="382" y="282" font-size="13" font-weight="700" letter-spacing="1" fill="#243b5c">MARGIN REQUIRED</text>
    <text x="382" y="316" font-size="26" font-weight="800" fill="#0b1220">$1,000</text>
    <text x="382" y="366" font-size="13" font-weight="700" letter-spacing="1" fill="#243b5c">RISK IF STOP HITS</text>
    <text x="382" y="400" font-size="26" font-weight="800" fill="#0b1220">$1,000</text>
  </g>
  <g>
    <rect x="666" y="140" width="284" height="300" rx="16" fill="#fff" stroke="#dbe3ef"/>
    <text x="690" y="196" font-size="36" font-weight="800" fill="#0e9f6e">1:10</text>
    <text x="690" y="222" font-size="15" font-weight="700" fill="#6b7a92">Futures</text>
    <line x1="690" y1="244" x2="926" y2="244" stroke="#dbe3ef"/>
    <text x="690" y="282" font-size="13" font-weight="700" letter-spacing="1" fill="#243b5c">MARGIN REQUIRED</text>
    <text x="690" y="316" font-size="26" font-weight="800" fill="#0b1220">$10,000</text>
    <text x="690" y="366" font-size="13" font-weight="700" letter-spacing="1" fill="#243b5c">RISK IF STOP HITS</text>
    <text x="690" y="400" font-size="26" font-weight="800" fill="#0b1220">$1,000</text>
  </g>
  <text x="50" y="482" font-size="13" fill="#6b7a92">Risk is set by position size and stop distance, not by the leverage on the account — leverage only changes the margin locked up.</text>
</svg>

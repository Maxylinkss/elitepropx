<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-label="One MNQ point is worth two dollars, one tick is fifty cents, the tick size is a quarter point and four ticks make a point, with a bar comparison against MES at five dollars, NQ at twenty dollars and ES at fifty dollars per point" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="940" height="520" fill="#fff"/>
  <text x="48" y="50" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">CONTRACT ARITHMETIC</text>
  <text x="48" y="86" font-size="26" font-weight="800" fill="#0b1220">One MNQ point, four ways to read it</text>

  <g>
    <rect x="48" y="112" width="196" height="104" rx="10" fill="#f4f7fc"/>
    <text x="66" y="164" font-size="30" font-weight="800" fill="#0b1220">$2.00</text>
    <text x="66" y="192" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b7a92">PER POINT</text>
  </g>
  <g>
    <rect x="272" y="112" width="196" height="104" rx="10" fill="#e7f7f0" stroke="#0e9f6e" stroke-width="1.5"/>
    <text x="290" y="164" font-size="30" font-weight="800" fill="#0e9f6e">$0.50</text>
    <text x="290" y="192" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0b1220">PER TICK</text>
  </g>
  <g>
    <rect x="496" y="112" width="196" height="104" rx="10" fill="#f4f7fc"/>
    <text x="514" y="164" font-size="30" font-weight="800" fill="#0b1220">0.25 pt</text>
    <text x="514" y="192" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b7a92">TICK SIZE</text>
  </g>
  <g>
    <rect x="720" y="112" width="196" height="104" rx="10" fill="#f4f7fc"/>
    <text x="738" y="164" font-size="30" font-weight="800" fill="#0b1220">4 ticks</text>
    <text x="738" y="192" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b7a92">MAKE ONE POINT</text>
  </g>

  <text x="48" y="272" font-size="15" font-weight="800" fill="#0b1220">What one point pays, per contract</text>

  <g>
    <text x="48" y="316" font-size="13.5" font-weight="800" fill="#0b1220">MNQ</text>
    <rect x="150" y="300" width="560" height="24" rx="6" fill="#f4f7fc"/>
    <rect x="150" y="300" width="22" height="24" rx="6" fill="#e7f7f0" stroke="#0e9f6e" stroke-width="1.5"/>
    <text x="742" y="317" font-size="13.5" font-weight="800" fill="#0e9f6e">$2 / pt</text>
  </g>
  <g>
    <text x="48" y="360" font-size="13.5" font-weight="800" fill="#0b1220">MES</text>
    <rect x="150" y="344" width="560" height="24" rx="6" fill="#f4f7fc"/>
    <rect x="150" y="344" width="56" height="24" rx="6" fill="#fdf3d8" stroke="#f2b705" stroke-width="1.5"/>
    <text x="742" y="361" font-size="13.5" font-weight="800" fill="#f2b705">$5 / pt</text>
  </g>
  <g>
    <text x="48" y="404" font-size="13.5" font-weight="800" fill="#0b1220">NQ</text>
    <rect x="150" y="388" width="560" height="24" rx="6" fill="#f4f7fc"/>
    <rect x="150" y="388" width="224" height="24" rx="6" fill="#e7f7f0" stroke="#0e9f6e" stroke-width="1.5"/>
    <text x="742" y="405" font-size="13.5" font-weight="800" fill="#0e9f6e">$20 / pt</text>
  </g>
  <g>
    <text x="48" y="448" font-size="13.5" font-weight="800" fill="#0b1220">ES</text>
    <rect x="150" y="432" width="560" height="24" rx="6" fill="#f4f7fc"/>
    <rect x="150" y="432" width="560" height="24" rx="6" fill="#fbe9e8" stroke="#d9534f" stroke-width="1.5"/>
    <text x="742" y="449" font-size="13.5" font-weight="800" fill="#d9534f">$50 / pt</text>
  </g>

  <text x="48" y="492" font-size="13" fill="#3d4a61">Ten MNQ contracts move the same dollars as one NQ. The multiplier is fixed; only the notional grows with the index level.</text>
</svg>

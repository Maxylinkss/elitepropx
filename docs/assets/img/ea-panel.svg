<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="The prop firm passing EA control panel showing risk per trade, daily loss guard, maximum loss floor, profit target, consistency cap, minimum trading days, news filter and weekend flatten" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="940" height="560" fill="#f4f7fc"/>
  <text x="60" y="40" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">THE CONTROL PANEL</text>
  <text x="60" y="78" font-size="27" font-weight="800" fill="#0b1220">Every decision is a number you can read</text>
  <rect x="60" y="100" width="820" height="404" rx="14" fill="#0b1220"/>
  <circle cx="90" cy="122" r="5" fill="#d9534f"/>
  <circle cx="110" cy="122" r="5" fill="#f2b705"/>
  <circle cx="130" cy="122" r="5" fill="#0e9f6e"/>
  <text x="154" y="127" font-size="12.5" font-weight="700" fill="#9fb0c9">PropFirmPassingEA v2.4 &#183; EURUSD, H1</text>
  <line x1="60" y1="142" x2="880" y2="142" stroke="#243b5c"/>
  <g>
    <text x="92" y="176" font-size="13.5" fill="#cdd8e8">Risk per trade</text>
    <rect x="652" y="160" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="176" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">0.4% of balance</text>
  </g>
  <g>
    <text x="92" y="214" font-size="13.5" fill="#cdd8e8">Daily loss guard</text>
    <rect x="652" y="198" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="214" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">$4,000 of $5,000</text>
  </g>
  <g>
    <text x="92" y="252" font-size="13.5" fill="#cdd8e8">Maximum loss floor</text>
    <rect x="652" y="236" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="252" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">tracking, 6% buffer</text>
  </g>
  <g>
    <text x="92" y="290" font-size="13.5" fill="#cdd8e8">Profit target</text>
    <rect x="652" y="274" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="290" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">10.00% - lock on hit</text>
  </g>
  <g>
    <text x="92" y="328" font-size="13.5" fill="#cdd8e8">Consistency cap</text>
    <rect x="652" y="312" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="328" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">35% per day</text>
  </g>
  <g>
    <text x="92" y="366" font-size="13.5" fill="#cdd8e8">Minimum trading days</text>
    <rect x="652" y="350" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="366" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">paced, 10 days</text>
  </g>
  <g>
    <text x="92" y="404" font-size="13.5" fill="#cdd8e8">News filter</text>
    <rect x="652" y="388" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="404" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">on, 30 min each side</text>
  </g>
  <g>
    <text x="92" y="442" font-size="13.5" fill="#cdd8e8">Weekend flatten</text>
    <rect x="652" y="426" width="196" height="24" rx="12" fill="#0f2a24" stroke="#1d6b52"/>
    <text x="750" y="442" font-size="12.5" font-weight="700" fill="#57e0ae" text-anchor="middle">on, Friday 20:00</text>
  </g>
  <line x1="60" y1="462" x2="880" y2="462" stroke="#243b5c"/>
  <circle cx="92" cy="482" r="4" fill="#57e0ae"/>
  <text x="106" y="486" font-size="12.5" fill="#9fb0c9">Autotrading on &#183; London and New York sessions</text>
  <text x="848" y="486" font-size="12.5" font-weight="700" fill="#9fb0c9" text-anchor="end">balance $100,000</text>
  <text x="60" y="538" font-size="13" fill="#6b7a92">The risk profile is written from the firm's published limits, not from a template, and the guardrails are not optional.</text>
</svg>

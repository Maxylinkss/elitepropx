<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Payout timeline from passing the evaluation to receiving the first withdrawal" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="1000" height="420" fill="#f4f7fc"/>
  <text x="52" y="52" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">FROM PASS TO PAYOUT</text>
  <text x="52" y="88" font-size="27" font-weight="800" fill="#0b1220">Six checkpoints before money leaves the firm</text>
  <line x1="90" y1="220" x2="910" y2="220" stroke="#cfdbeb" stroke-width="3"/>
  <g>
    <circle cx="90" cy="220" r="13" fill="#fff" stroke="#0e9f6e" stroke-width="4"/>
    <circle cx="90" cy="220" r="4.5" fill="#0e9f6e"/>
    <text x="90" y="262" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">Evaluation</text>
    <text x="90" y="281" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">passed</text>
    <text x="90" y="303" font-size="11.5" fill="#6b7a92" text-anchor="middle">Rules verified</text>
  </g>
  <g>
    <circle cx="254" cy="220" r="13" fill="#fff" stroke="#0e9f6e" stroke-width="4"/>
    <circle cx="254" cy="220" r="4.5" fill="#0e9f6e"/>
    <text x="254" y="262" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">Funded</text>
    <text x="254" y="281" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">login</text>
    <text x="254" y="303" font-size="11.5" fill="#6b7a92" text-anchor="middle">New limits apply</text>
  </g>
  <g>
    <circle cx="418" cy="220" r="13" fill="#fff" stroke="#0e9f6e" stroke-width="4"/>
    <circle cx="418" cy="220" r="4.5" fill="#0e9f6e"/>
    <text x="418" y="262" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">Minimum</text>
    <text x="418" y="281" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">days</text>
    <text x="418" y="303" font-size="11.5" fill="#6b7a92" text-anchor="middle">Usually 5–10</text>
  </g>
  <g>
    <circle cx="582" cy="220" r="13" fill="#fff" stroke="#0e9f6e" stroke-width="4"/>
    <circle cx="582" cy="220" r="4.5" fill="#0e9f6e"/>
    <text x="582" y="262" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">Profit</text>
    <text x="582" y="281" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">target</text>
    <text x="582" y="303" font-size="11.5" fill="#6b7a92" text-anchor="middle">Typically 5–10%</text>
  </g>
  <g>
    <circle cx="746" cy="220" r="13" fill="#fff" stroke="#0e9f6e" stroke-width="4"/>
    <circle cx="746" cy="220" r="4.5" fill="#0e9f6e"/>
    <text x="746" y="262" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">KYC</text>
    <text x="746" y="281" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle"></text>
    <text x="746" y="303" font-size="11.5" fill="#6b7a92" text-anchor="middle">ID + address</text>
  </g>
  <g>
    <circle cx="910" cy="220" r="13" fill="#fff" stroke="#0e9f6e" stroke-width="4"/>
    <circle cx="910" cy="220" r="4.5" fill="#0e9f6e"/>
    <text x="910" y="262" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">Payout</text>
    <text x="910" y="281" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle"></text>
    <text x="910" y="303" font-size="11.5" fill="#6b7a92" text-anchor="middle">1–7 business days</text>
  </g>
  <text x="52" y="360" font-size="13.5" fill="#3d4a61">Firms differ on minimum trading days and profit thresholds, but the sequence is almost always identical.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-label="Daily loss limit divided into three trade slots" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="940" height="520" fill="#fff"/>
  <text x="48" y="50" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">POSITION SIZING</text>
  <text x="48" y="86" font-size="27" font-weight="800" fill="#0b1220">Spend the daily loss limit in thirds</text>
  <rect x="48" y="120" width="844" height="54" rx="10" fill="#f4f7fc" stroke="#dbe3ef"/>
  <rect x="48" y="120" width="281" height="54" rx="10" fill="#c9f2e2"/>
  <rect x="329" y="120" width="281" height="54" fill="#fdf0c8"/>
  <rect x="610" y="120" width="281" height="54" rx="10" fill="#f8d7d5"/>
  <text x="70" y="153" font-size="14" font-weight="700" fill="#0b1220">Trade 1 · 1/3 of limit</text>
  <text x="351" y="153" font-size="14" font-weight="700" fill="#0b1220">Trade 2 · 1/3 of limit</text>
  <text x="632" y="153" font-size="14" font-weight="700" fill="#0b1220">Trade 3 · 1/3 of limit</text>
  <text x="48" y="210" font-size="14" fill="#3d4a61">On a $100,000 account with a 5% daily limit ($5,000), each slot is roughly $1,650 of risk.</text>
  <g>
    <rect x="48" y="250" width="264" height="112" rx="12" fill="#fff" stroke="#dbe3ef"/>
    <text x="70" y="302" font-size="30" font-weight="800" fill="#0b1220">$5,000</text>
    <text x="70" y="330" font-size="13" fill="#6b7a92">daily limit</text>
  </g>
  <g>
    <rect x="328" y="250" width="264" height="112" rx="12" fill="#fff" stroke="#dbe3ef"/>
    <text x="350" y="302" font-size="30" font-weight="800" fill="#0b1220">$1,650</text>
    <text x="350" y="330" font-size="13" fill="#6b7a92">per trade</text>
  </g>
  <g>
    <rect x="608" y="250" width="264" height="112" rx="12" fill="#fff" stroke="#dbe3ef"/>
    <text x="630" y="302" font-size="30" font-weight="800" fill="#0b1220">$5,000</text>
    <text x="630" y="330" font-size="13" fill="#6b7a92">total at risk</text>
  </g>
  <rect x="48" y="392" width="844" height="76" rx="12" fill="#e7f7f0" stroke="#c9f2e2"/>
  <text x="70" y="423" font-size="14" font-weight="800" fill="#0e9f6e">Why thirds?</text>
  <text x="70" y="447" font-size="13.5" fill="#3d4a61">Three consecutive losses in one day is a normal statistical event. Three losses should never be fatal.</text>
</svg>

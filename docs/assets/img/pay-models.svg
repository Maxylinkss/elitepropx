<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Three payment models for paying to pass a prop firm challenge: upfront service fee, deferred activation fee, and profit share on success" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="1000" height="520" fill="#fff"/>
  <text x="50" y="50" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">THREE WAYS MONEY MOVES</text>
  <text x="50" y="88" font-size="27" font-weight="800" fill="#0b1220">Paying to pass, and who carries the failure</text>
  <g>
    <rect x="50" y="130" width="290" height="300" rx="14" fill="#e7f7f0" stroke="#bfe9d7"/>
    <text x="74" y="174" font-size="16.5" font-weight="800" fill="#0b1220">Pay a service upfront</text>
    <text x="74" y="216" font-size="13" fill="#3d4a61">• Money moves before the attempt</text>
    <text x="74" y="248" font-size="13" fill="#3d4a61">• Provider absorbs the retries</text>
    <text x="74" y="280" font-size="13" fill="#3d4a61">• Published rates: $220–$588</text>
    <line x1="74" y1="330" x2="316" y2="330" stroke="#bfe9d7" stroke-width="1.5"/>
    <text x="74" y="368" font-size="13" font-weight="800" fill="#0e9f6e">Failure cost: covered</text>
  </g>
  <g>
    <rect x="360" y="130" width="290" height="300" rx="14" fill="#f4f7fc" stroke="#dbe3ef"/>
    <text x="384" y="174" font-size="16.5" font-weight="800" fill="#0b1220">Pay the firm after you pass</text>
    <text x="384" y="216" font-size="13" fill="#3d4a61">• Low entry fee, activation later</text>
    <text x="384" y="248" font-size="13" fill="#3d4a61">• You trade the evaluation</text>
    <text x="384" y="280" font-size="13" fill="#3d4a61">• The fee is still owed on success</text>
    <line x1="384" y1="330" x2="626" y2="330" stroke="#dbe3ef" stroke-width="1.5"/>
    <text x="384" y="368" font-size="13" font-weight="800" fill="#243b5c">Failure cost: your calendar</text>
  </g>
  <g>
    <rect x="670" y="130" width="290" height="300" rx="14" fill="#f4f7fc" stroke="#dbe3ef"/>
    <text x="694" y="174" font-size="16.5" font-weight="800" fill="#0b1220">Pay on success (split)</text>
    <text x="694" y="216" font-size="13" fill="#3d4a61">• No fee to start</text>
    <text x="694" y="248" font-size="13" fill="#3d4a61">• A share of each payout</text>
    <text x="694" y="280" font-size="13" fill="#3d4a61">• Typically 30–35% of profit</text>
    <line x1="694" y1="330" x2="936" y2="330" stroke="#dbe3ef" stroke-width="1.5"/>
    <text x="694" y="368" font-size="13" font-weight="800" fill="#243b5c">Failure cost: share of winnings</text>
  </g>
  <text x="50" y="472" font-size="13.5" fill="#3d4a61">Only the first model prices the retry. The other two leave it with you, which is why the headline fee is not the cost.</text>
</svg>

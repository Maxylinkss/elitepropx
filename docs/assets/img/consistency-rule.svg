<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" role="img" aria-label="Consistency rule bar chart where the best day must stay under thirty percent of total profit" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
  <rect width="940" height="540" fill="#fff"/>
  <text x="48" y="50" font-size="13" font-weight="800" letter-spacing="3" fill="#0e9f6e">CONSISTENCY RULE</text>
  <text x="48" y="86" font-size="27" font-weight="800" fill="#0b1220">One huge day can block your payout</text>
  <g>
    <rect x="90" y="307" width="86" height="33" rx="6" fill="#0e9f6e" opacity="0.85"/>
    <text x="90" y="295" font-size="13" font-weight="700" fill="#0b1220">$900</text>
    <text x="90" y="364" font-size="13" fill="#6b7a92">Mon</text>
  </g>
  <g>
    <rect x="240" y="262" width="86" height="78" rx="6" fill="#0e9f6e" opacity="0.85"/>
    <text x="240" y="250" font-size="13" font-weight="700" fill="#0b1220">$2,100</text>
    <text x="240" y="364" font-size="13" fill="#6b7a92">Tue</text>
  </g>
  <g>
    <rect x="390" y="102" width="86" height="238" rx="6" fill="#f2b705" opacity="1"/>
    <text x="390" y="90" font-size="13" font-weight="700" fill="#9a6208">$6,400</text>
    <text x="390" y="364" font-size="13" fill="#6b7a92">Wed</text>
  </g>
  <g>
    <rect x="540" y="273" width="86" height="67" rx="6" fill="#0e9f6e" opacity="0.85"/>
    <text x="540" y="261" font-size="13" font-weight="700" fill="#0b1220">$1,800</text>
    <text x="540" y="364" font-size="13" fill="#6b7a92">Thu</text>
  </g>
  <g>
    <rect x="690" y="243" width="86" height="97" rx="6" fill="#0e9f6e" opacity="0.85"/>
    <text x="690" y="231" font-size="13" font-weight="700" fill="#0b1220">$2,600</text>
    <text x="690" y="364" font-size="13" fill="#6b7a92">Fri</text>
  </g>
  <line x1="70" y1="196" x2="880" y2="196" stroke="#d9534f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="700" y="188" font-size="12.5" font-weight="700" fill="#d9534f">30% of $14,800 = $4,440</text>
  <text x="48" y="410" font-size="14" fill="#3d4a61">Wednesday alone is 43% of total profit, so the account fails the consistency check even though the target is met.</text>
  <rect x="48" y="438" width="844" height="66" rx="12" fill="#f4f7fc" stroke="#dbe3ef"/>
  <text x="70" y="466" font-size="13" font-weight="800" fill="#0b1220">The fix:</text>
  <text x="70" y="489" font-size="13" fill="#3d4a61">cap any single day at roughly a third of your profit target and keep adding ordinary, boring winning days.</text>
</svg>

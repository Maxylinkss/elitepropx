<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Twelve-session pass timeline rising from the starting balance to the profit target, with cushion, pace, target zone and lock phases" font-family="Arial, Helvetica, 'Segoe UI', sans-serif">
